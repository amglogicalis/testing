name: Sphexn Nudus — Test Runner & Closed-Loop Self-Healing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: heal (closed-loop fix) or dry-run (diagnose only)'
        required: true
        default: 'heal'
      test_cmd:
        description: 'Test command to execute (e.g. npm test, pytest, cargo test)'
        required: true
        default: 'npm test'
      max_retries:
        description: 'Maximum closed-loop self-healing attempts (1-5)'
        required: false
        default: '3'
      repo:
        description: 'Target repository (owner/repo)'
        required: true
        default: ''
      branch:
        description: 'Target branch'
        required: true
        default: 'main'
      create_pr:
        description: 'Whether to open an automated Pull Request when healed (true/false)'
        required: false
        default: 'true'
      open_issue:
        description: 'Whether to open an automated GitHub Issue if unhealed (true/false)'
        required: false
        default: 'true'
      fallback_matrix:
        description: 'JSON list of prioritized fallback model providers'
        required: false
        default: '[]'

  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'lib/**'
      - 'test/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  nudus-heal:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sphexn Nudus Self-Healing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_MODELS_TOKEN: ${{ secrets.TOKEN_GH || secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ github.event_name == 'push' && 'heal' || inputs.mode }}"
          REPO="${{ github.event_name == 'push' && github.repository || inputs.repo }}"
          BRANCH="${{ github.event_name == 'push' && github.ref_name || inputs.branch }}"
          TEST_CMD="${{ inputs.test_cmd || 'npm test' }}"
          RETRIES="${{ inputs.max_retries || '3' }}"
          CREATE_PR="${{ inputs.create_pr != '' && inputs.create_pr || 'true' }}"
          OPEN_ISSUE="${{ inputs.open_issue != '' && inputs.open_issue || 'true' }}"
          node .sphexn/nudus-runner.cjs "$MODE" "$TEST_CMD" "$RETRIES" "$REPO" "$BRANCH" "$CREATE_PR" "$OPEN_ISSUE" '${{ inputs.fallback_matrix }}'

      - name: Commit and Push Nudus Audits
        run: |
          git config --global user.name "Sphexn Nudus [Bot]"
          git config --global user.email "bot@sphexn.terra"
          if [ -d "audits" ]; then
            git add audits/ || true
            if ! git diff --staged --quiet; then
              git commit -m "chore(nudus): record closed-loop self-healing test audit" || true
              git push origin "$BRANCH" || git push origin HEAD || echo "Audit committed or up-to-date"
            fi
          else
            echo "No audits directory found to commit"
          fi
