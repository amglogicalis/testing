name: Sphexn Rex — Autonomous DevOps Orchestrator & Notifier

on:
  workflow_dispatch:
    inputs:
      plan_content:
        description: 'Inline declarative markdown plan definition (optional)'
        required: false
        default: ''
      plan_file:
        description: 'Path to markdown plan file'
        required: false
        default: 'sphexn_rex.md'
      task_filter:
        description: 'Optional filter for specific task ID or name'
        required: false
        default: ''
      self_heal:
        description: 'Enable closed-loop autonomous self-healing (true/false)'
        required: false
        default: 'true'
      max_retries:
        description: 'Maximum self-healing attempts (1-5)'
        required: false
        default: '3'
      notify_email:
        description: 'Target email recipient for HTML report'
        required: false
        default: ''
      notify_webhook:
        description: 'Target Webhook URL (Discord / Slack / Teams / generic)'
        required: false
        default: ''
      fallback_matrix:
        description: 'JSON fallback AI models matrix'
        required: false
        default: '[]'
      repo:
        description: 'Target repository (owner/repo)'
        required: false
        default: ''
      branch:
        description: 'Target branch'
        required: false
        default: 'main'

  push:
    branches:
      - '**'
    paths:
      - 'sphexn_rex.md'
      - '.sphexn/rex/**'
      - '.sphexn/rex-runner.cjs'
      - '.github/workflows/sphexn-rex.yml'

  pull_request:
    paths:
      - 'sphexn_rex.md'
      - '.sphexn/rex/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rex-orchestrator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Sphexn Rex Orchestrator
        env:
          INPUT_PLAN_FILE: ${{ github.event.inputs.plan_file || 'sphexn_rex.md' }}
          INPUT_PLAN_CONTENT: ${{ github.event.inputs.plan_content || '' }}
          INPUT_TASK_FILTER: ${{ github.event.inputs.task_filter || '' }}
          INPUT_SELF_HEAL: ${{ github.event.inputs.self_heal || 'true' }}
          INPUT_MAX_RETRIES: ${{ github.event.inputs.max_retries || '3' }}
          INPUT_NOTIFY_EMAIL: ${{ github.event.inputs.notify_email || '' }}
          INPUT_NOTIFY_WEBHOOK: ${{ github.event.inputs.notify_webhook || '' }}
          INPUT_FALLBACK_MATRIX: ${{ github.event.inputs.fallback_matrix || '[]' }}
          INPUT_REPO: ${{ github.event.inputs.repo || github.repository }}
          INPUT_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node .sphexn/rex-runner.cjs

      - name: Commit and Push Rex Tasks & Audits
        if: always()
        run: |
          git config user.name "Sphexn Rex [Bot]"
          git config user.email "sphexn-rex@terra.bot"
          git add audits/rex/ .sphexn/rex/ sphexn_report.md sphexn_report.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(rex): record execution audit, tasks and reports [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin ${{ github.ref_name }} || true
          fi
